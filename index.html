<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta
            name="description"
            content="ekRAAH - India's Unified Digital Government Services Platform. Har Kaam ki Ek Raah."
        />
        <meta name="theme-color" content="#FF9933" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="ekRAAH" />
        <link rel="manifest" href="manifest.json" />
        <link rel="icon" type="image/png" href="assets/mini-logo.png" />
        <link rel="apple-touch-icon" href="assets/mini-logo.png" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
        <link rel="stylesheet" href="css/styles.css" />
        <title>ekRAAH - Har Kaam ki Ek Raah</title>
    </head>
    <body>
        <!-- App Root -->
        <div id="app"></div>

        <!-- Toast Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Notification Panel -->
        <div id="notification-overlay" class="notification-overlay" style="display: none"></div>
        <div id="notification-panel" class="notification-panel" style="display: none"></div>

        <!-- Chatbot -->
        <div id="chatbot-container"></div>

        <!-- PWA Install Banner -->
        <div id="pwa-banner" class="pwa-banner" style="display: none">
            <div class="pwa-banner-content">
                <i class="fas fa-download"></i>
                <span>Install ekRAAH for quick access</span>
            </div>
            <div class="pwa-banner-actions">
                <button id="pwa-install-btn" class="btn btn-sm btn-primary">Install</button>
                <button id="pwa-dismiss-btn" class="btn btn-icon btn-sm"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <!-- Modal Container -->
        <div id="modal-container"></div>

        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase-config.js"></script>
        <script src="js/state.js"></script>
        <script src="js/router.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/db.js"></script>
        <script src="js/components.js"></script>
        <script src="js/pages/auth.js"></script>
        <script src="js/pages/citizen.js"></script>
        <script src="js/pages/government.js"></script>
        <script src="js/pages/lawyer.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
